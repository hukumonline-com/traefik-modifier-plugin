# dynamic.yaml

http:
  routers:
    # Chat service router - for request and response masking
    chat:
      rule: "Host(`chat.localhost`)"
      entryPoints:
        - web
      middlewares:
        - chat-modifier
      service: chat-service

    # Create-conversation router - demonstrates .request.headers / .request.method / .request.url / .request.path
    create-conversation:
      rule: "Host(`api.localhost`) && PathPrefix(`/v1/conversation`)"
      entryPoints:
        - web
      middlewares:
        - create-conversation-modifier
      service: chat-service

  middlewares:
    # Chat service middleware - masks both request and response
    chat-modifier:
      plugin:
        modifier:
          ModifierHeader:
          # if x-api-key=sk-didin then change to Authorization: Bearer 
            Authorization : |
              [[ if eq (index .request.headers "x-api-key") "sk-didin" ]]
                Bearer sk-didin
              [[ else if eq (index .request.headers "x-api-key") "sk-didin-test" ]]
                Bearer sk-didin-test
              [[ else ]]
                Bearer sk-default
              [[ end ]]
          ModifierQuery: 
            Transform:
              # Transform ask_id parameter to question_id with context timestamp
              question_id: "ask_[[ .context.unixtime ]]"
          ModifierRequest: |
              {
                "question": "[[ .request.api.body.ask ]]",
                "timestamp": "[[ .context.unixtime ]]"
              }
          ModifierResponse:
            "200": |
              {
                "id": [[ .response.body.id ]],
                "answer": "[[ .request.api.body.ask ]]",
                "timestamp": [[ .request.modified.body.timestamp ]],
                "datas": [
                  [[ $dataList := .response.body.data_array_of_maps ]]
                  [[ $listLen := len $dataList ]]
                  [[ range $index, $element := $dataList ]]
                    [[ if $index ]], [[ end ]]{"[[ $element.key1 ]]" : "[[ $element.key2 ]]"}
                  [[ end ]]
                ]
              }

    # Sample middleware: demonstrating .request.headers / .request.method / .request.url / .request.path
    # Fix: previously caused "index of untyped nil" because request metadata was not populated.
    create-conversation-modifier:
      plugin:
        modifier:
          ModifierHeader:
            # Set Authorization based on x-api-key header value
            Authorization: |
              [[ if eq (index .request.headers "x-api-key") "komdigi_secret" ]]
                Bearer komdigi_token
              [[ else if eq (index .request.headers "x-api-key") "tr_secret" ]]
                Bearer tr_token
              [[ else ]]
                Bearer default_token
              [[ end ]]
          ModifierRequest: |
            {
              "session_id": "[[ if eq (index .request.headers "x-api-key") "komdigi_secret" ]]komdigi_[[ else if eq (index .request.headers "x-api-key") "tr_secret" ]]tr_[[ else ]]unknown_[[ end ]][[ .context.unixtime ]]",
              "message": "[[ .request.api.body.message ]]",
              "meta": {
                "method": "[[ .request.method ]]",
                "url":    "[[ .request.url ]]",
                "path":   "[[ .request.path ]]",
                "source": "[[ index .request.headers "x-source" ]]"
              }
            }
          ModifierResponse:
            "200": |
              {
                "conversation_id": "[[ .response.body.id ]]",
                "session_id": "[[ .request.modified.body.session_id ]]",
                "reply": "[[ .response.body.answer ]]",
                "debug": {
                  "requested_by": "[[ index .request.headers "x-api-key" ]]",
                  "method":       "[[ .request.method ]]",
                  "path":         "[[ .request.path ]]"
                }
              }

  services:
    chat-service:
      loadBalancer:
        servers:
          - url: "http://chat-service:3000"